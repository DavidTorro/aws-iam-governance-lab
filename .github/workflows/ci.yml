name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - name: Formato
        run: terraform fmt -check -recursive
      - name: Inicializar
        run: terraform -chdir=envs/floci init -backend=false -input=false -lockfile=readonly
      - name: Validar
        run: terraform -chdir=envs/floci validate
      - name: Tests de identidades
        run: terraform -chdir=envs/floci test

  policies-json:
    name: Validar políticas JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validar archivos de políticas presentes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("policies").glob("*-policy.json"))
          expected = {"dev-team-policy.json", "ops-team-policy.json", "secops-team-policy.json"}
          assert {path.name for path in paths} == expected, "Deben existir las tres políticas"
          for path in paths:
              with path.open(encoding="utf-8") as file:
                  policy = json.load(file)
              assert policy["Version"] == "2012-10-17", path
              statements = policy["Statement"]
              assert statements and len({item["Sid"] for item in statements}) == len(statements), path
              for item in statements:
                  assert item["Effect"] in {"Allow", "Deny"}, path
                  assert item["Action"] and item["Resource"], path
              print(f"OK: {path}")
          PY

  mkdocs-build:
    name: Construir documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias del PDF
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Instalar MkDocs
        run: pip install -r requirements.txt
      - name: Comprobar la documentación
        run: mkdocs build --strict
